# Homelab RPi4 Secrets Template
# To encrypt for your RPi4 host key:
#   1. Obtain Pi's age public key from its SSH host key:
#        nix-shell -p ssh-to-age --run "ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub"
#   2. Add the age key to .sops.yaml
#   3. Encrypt this file:
#        sops -e -i hosts/rpi4/secrets/secrets.yaml
