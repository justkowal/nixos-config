[package]
name = "labd"
version = "0.1.0"
edition = "2021"
description = "Kowal Lab shell daemon: state bus and island"

[dependencies]
async-channel = "2.5.0"
gio-unix = "0.22.8"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
bitflags = "2"
libc = "0.2.190"
libadwaita = { version = "0.9.2", features = ["v1_5"] }
serde_json = "1.0.154"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
cairo-rs = { version = "0.22", features = ["png"] }
