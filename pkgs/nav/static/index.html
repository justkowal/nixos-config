<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kowal Nav</title>
<meta name="nav-build" content="dev">
<meta name="description" content="Door to door routes across every operator in Silesia and Lesser Poland.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nav">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></symbol>
  <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="i-bus" viewBox="0 0 24 24"><path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></symbol>
  <symbol id="i-rail" viewBox="0 0 24 24"><path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/></symbol>
  <symbol id="i-tram" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h.01"/><path d="M16 15h.01"/></symbol>
  <symbol id="i-transit" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h.01"/><path d="M16 15h.01"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-nav" viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.7 2 2 0 3.3-.6 4.3-1.2a.5.5 0 0 1 .8.4v10.2a1 1 0 0 1-.4.8c-1 .7-2.3 1.2-4.3 1.2-2.7 0-4.7-2-7.7-2a6 6 0 0 0-3.6 1.2"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
</svg>

<div id="map" role="application" aria-label="Map"></div>

<div class="mapctl glass" id="mapctl">
  <button id="btn-dio" class="icon-btn" aria-label="Diorama mode" title="Diorama mode: just the view"><svg class="ic"><use href="#i-expand"/></svg></button>
  <button id="locate" class="icon-btn" aria-label="Show my location"><svg class="ic"><use href="#i-locate"/></svg></button>
</div>

<nav id="tabs" class="tabs glass" role="tablist" aria-label="Sections">
  <button role="tab" id="tab-explore" aria-controls="view-explore" aria-selected="true" data-tab="explore"><svg class="ic"><use href="#i-search"/></svg><span>Explore</span></button>
  <button role="tab" id="tab-plan" aria-controls="view-plan" aria-selected="false" data-tab="plan" tabindex="-1"><svg class="ic"><use href="#i-nav"/></svg><span>Plan</span></button>
  <button role="tab" id="tab-near" aria-controls="view-near" aria-selected="false" data-tab="near" tabindex="-1"><svg class="ic"><use href="#i-bus"/></svg><span>Stops</span></button>
  <button role="tab" id="tab-info" aria-controls="view-info" aria-selected="false" data-tab="info" tabindex="-1"><svg class="ic"><use href="#i-info"/></svg><span>About</span></button>
</nav>

<section id="sheet" class="sheet glass" aria-label="Trip planner">
  <button id="grabber" class="grabber" aria-label="Resize panel"><span></span></button>

  <div id="view-explore" class="view" role="tabpanel" aria-labelledby="tab-explore">
    <div class="pane" id="explore-main">
      <div class="fields">
        <div class="field">
          <svg class="ic mark-to" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="ex-q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search places and addresses" aria-label="Search places">
          <button class="icon-btn small" id="ex-clear" aria-label="Clear search" hidden><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
      </div>
      <ul id="ex-suggest" class="list" role="listbox" aria-label="Suggestions" hidden></ul>
      <div id="cats" class="chips cats" role="group" aria-label="Categories"></div>
      <div id="ex-status" class="status" role="status" aria-live="polite"></div>
      <ul id="ex-results" class="list places"></ul>
      <section id="saved-box" hidden><h3 class="sec">Saved</h3><ul id="saved-list" class="list places"></ul></section>
    </div>
    <div class="pane" id="explore-place" hidden>
      <header class="bar"><button class="back" data-back="explore"><svg class="ic"><use href="#i-back"/></svg>Explore</button><h2 id="place-title"></h2></header>
      <div id="place" class="place"></div>
    </div>
  </div>

  <div id="view-plan" class="view" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <div class="pane" id="plan-main">
      <div class="fields">
        <div class="field">
          <span class="mark mark-from" aria-hidden="true"></span>
          <input id="from" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Current location" aria-label="From">
          <button class="icon-btn small" data-clear="from" aria-label="Clear origin" hidden><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="field">
          <svg class="ic mark-to" aria-hidden="true"><use href="#i-pin"/></svg>
          <input id="to" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Where to?" aria-label="To">
          <button class="icon-btn small" data-clear="to" aria-label="Clear destination" hidden><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <button id="swap" class="icon-btn swap" aria-label="Swap origin and destination"><svg class="ic"><use href="#i-swap"/></svg></button>
      </div>

      <ul id="suggest" class="list" role="listbox" aria-label="Suggestions" hidden></ul>

      <div id="options">
        <div class="seg" id="modes" role="radiogroup" aria-label="Travel mode">
          <button role="radio" aria-checked="true" data-mode="transit"><svg class="ic"><use href="#i-transit"/></svg><span>Transit</span></button>
          <button role="radio" aria-checked="false" data-mode="walk" tabindex="-1"><svg class="ic"><use href="#i-walk"/></svg><span>Walk</span></button>
          <button role="radio" aria-checked="false" data-mode="bike" tabindex="-1"><svg class="ic"><use href="#i-bike"/></svg><span>Bike</span></button>
          <button role="radio" aria-checked="false" data-mode="car" tabindex="-1"><svg class="ic"><use href="#i-car"/></svg><span>Car</span></button>
        </div>
        <div class="chips" id="transit-filter" role="group" aria-label="Transit types">
          <button class="chip" aria-pressed="true" data-t="rail"><svg class="ic"><use href="#i-rail"/></svg>Train</button>
          <button class="chip" aria-pressed="true" data-t="bus"><svg class="ic"><use href="#i-bus"/></svg>Bus</button>
          <button class="chip" aria-pressed="true" data-t="tram"><svg class="ic"><use href="#i-tram"/></svg>Tram</button>
        </div>
        <button id="when" class="row-btn" aria-expanded="false" aria-controls="when-panel"><svg class="ic"><use href="#i-clock"/></svg><span id="when-text">Leave now</span><svg class="ic chev"><use href="#i-chev"/></svg></button>
        <div id="when-panel" class="when-panel" hidden>
          <div class="seg two" id="by" role="radiogroup" aria-label="Time applies to">
            <button role="radio" aria-checked="true" data-by="depart"><span>Leave</span></button>
            <button role="radio" aria-checked="false" data-by="arrive" tabindex="-1"><span>Arrive</span></button>
          </div>
          <input id="at" type="datetime-local" aria-label="Date and time" step="300">
          <button id="now" class="text-btn">Now</button>
        </div>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
      <ol id="results" class="results"></ol>
    </div>

    <div class="pane" id="plan-detail" hidden>
      <header class="bar"><button class="back" data-back="plan"><svg class="ic"><use href="#i-back"/></svg>Routes</button><h2 id="detail-title"></h2><button id="start-nav" class="primary start">Start</button></header>
      <div id="detail" class="detail"></div>
    </div>
  </div>

  <div id="view-near" class="view" role="tabpanel" aria-labelledby="tab-near" hidden>
    <div class="pane" id="near-main">
      <header class="bar plain"><h2>Nearby stops</h2><button id="near-refresh" class="text-btn">Refresh</button></header>
      <div id="near-status" class="status" role="status" aria-live="polite"></div>
      <ul id="near-list" class="list stops"></ul>
    </div>
    <div class="pane" id="near-detail" hidden>
      <header class="bar"><button class="back" data-back="near"><svg class="ic"><use href="#i-back"/></svg>Stops</button><h2 id="stop-title"></h2></header>
      <div id="stop-status" class="status" role="status" aria-live="polite"></div>
      <ul id="stop-list" class="list deps"></ul>
    </div>
  </div>

  <div id="view-info" class="view" role="tabpanel" aria-labelledby="tab-info" hidden>
    <div class="pane">
      <header class="bar plain"><h2>About</h2></header>
      <div id="info" class="info"></div>
      <div class="actions">
        <button id="clear-recents" class="text-btn">Clear recent searches</button>
        <button id="logout" class="text-btn danger">Sign out</button>
      </div>
    </div>
  </div>
</section>

<section id="guide" class="guide" hidden aria-label="Navigation">
  <div class="guide-top glass" role="status" aria-live="polite">
    <span class="g-arrow" id="g-arrow" aria-hidden="true"><svg class="ic"><use href="#i-arrow"/></svg></span>
    <div class="g-main"><div id="g-dist" class="g-dist"></div><div id="g-text" class="g-text"></div><div id="g-then" class="g-then"></div><div id="g-live" class="g-live"></div><div id="g-notice" class="g-notice" role="alert"></div></div>
  </div>
  <div class="guide-bottom glass">
    <div class="g-eta"><b id="g-eta"></b><span id="g-left"></span></div>
    <button id="g-voice" class="chip" aria-pressed="false">Voice</button>
    <button id="g-recenter" class="chip" hidden>Recenter</button>
    <button id="g-end" class="primary danger-fill">End</button>
  </div>
</section>

<section id="diorama" class="diorama glass" hidden aria-label="Diorama controls">
  <div class="dio-time"><output id="dio-clock" for="dio-slider">12:00</output><input id="dio-slider" type="range" min="0" max="1439" step="1" value="720" aria-label="Time of day"><input id="dio-date" type="date" aria-label="Day"></div>
  <div id="dio-sun" class="dio-sun" aria-live="polite"></div>
  <div class="dio-btns">
    <button id="dio-live" class="chip" aria-pressed="true">Now</button>
    <button id="dio-rise" class="chip">Sunrise</button>
    <button id="dio-noon" class="chip">Noon</button>
    <button id="dio-set" class="chip">Sunset</button>
    <button id="dio-play" class="chip" aria-pressed="false">Play</button>
    <button id="dio-tilt" class="chip">Tilt 60°</button>
    <button id="dio-weather" class="chip">Weather: Auto</button>
    <button id="dio-terrain" class="chip" aria-pressed="true">Terrain 2x</button>
    <button id="dio-orbit" class="chip" aria-pressed="false">Orbit</button>
    <button id="dio-exit" class="primary">Exit</button>
  </div>
</section>

<main id="login" class="login" hidden>
  <form id="login-form" autocomplete="on">
    <svg class="logo" aria-hidden="true"><use href="#i-nav"/></svg>
    <h1>Kowal Nav</h1>
    <p>Private. Enter the passphrase to continue.</p>
    <input type="text" name="username" value="nav" autocomplete="username" hidden>
    <label for="pass">Passphrase</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required>
    <p id="login-err" class="err" role="alert"></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</main>

<script src="/vendor/maplibre-gl.js"></script>
<script src="/app.js" defer></script>
<script src="/scene3d.js" defer></script>
<script src="/roads3d.js" defer></script>
<script src="/daylight.js" defer></script>
<script src="/explore.js" defer></script>
<script src="/fleet.js" defer></script>
<script src="/traffic.js" defer></script>
<script src="/world.js" defer></script>
<script src="/dem.js" defer></script>
<script src="/sched.js" defer></script>
<script src="/roofs.js" defer></script>
<script src="/vehicles.js" defer></script>
<script src="/diorama.js" defer></script>
<script src="/guide.js" defer></script>
</body>
</html>
