[package]
name = "accubattery"
version = "0.1.0"
edition = "2021"
description = "AccuBattery session engine and daemon for Linux laptops"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
